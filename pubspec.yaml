name: belesah
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+2

environment:
  sdk: ^3.11.0


dependencies:

  flutter:
    sdk: flutter
  shared_preferences:
  pdf: ^3.10.8
  printing: ^5.14.3
  device_info_plus: ^13.1.0
  url_launcher: ^6.3.2
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0 
  



dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/plisse-Tech.png"


flutter:

  
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
         
          

  